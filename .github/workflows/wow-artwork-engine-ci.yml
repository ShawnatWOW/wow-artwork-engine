name: WOW Artwork Engine CI

on:
  push:
    branches: ['**']
    paths:
      - 'server/**'
      - 'web/**'
      - 'migrations/**'
      - 'scripts/spikes/**'
      - '.github/workflows/wow-artwork-engine-ci.yml'
  pull_request:
    paths:
      - 'server/**'
      - 'web/**'
      - 'migrations/**'
      - 'scripts/spikes/**'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Static build, NOT apt: Ubuntu mirror stalls wedged CI for 15+ minutes
      # on the apt step (2026-08-18, runs 32087832971/32088712781). The static
      # tarball needs no package mirrors and installs in seconds.
      - name: Install FFmpeg (static build)
        run: |
          curl -fsSL --retry 3 https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz | tar -xJ
          sudo install -m 755 ffmpeg-*-static/ffmpeg ffmpeg-*-static/ffprobe /usr/local/bin/
          ffmpeg -version | head -1

      - name: Install server deps
        working-directory: server
        run: npm install

      - name: Run server tests
        working-directory: server
        run: npm test

      - name: Run spikes (fixtures, no paid APIs)
        run: |
          node scripts/spikes/frame_break.js
          node scripts/spikes/eon_3pod.js

      - name: Build web
        working-directory: web
        run: npm install && npm run build
